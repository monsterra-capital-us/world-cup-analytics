# Temporary diagnostic (removed when done): verifies what the configured
# API-Football key can access for World Cup 2026 and runs a forced sync.
name: Feed probe

on: push

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: API-Football account status
        run: |
          curl -sS --max-time 60 "https://world-cup-analytics.vercel.app/api/schedule?af=status" | python3 -m json.tool | head -50
      - name: WC2026 fixtures access
        run: |
          curl -sS --max-time 60 "https://world-cup-analytics.vercel.app/api/schedule?af=fixtures" -o /tmp/fx.json
          python3 -c "
          import json
          d = json.load(open('/tmp/fx.json'))
          b = d.get('body', {})
          print('http:', d.get('status'), 'errors:', json.dumps(b.get('errors'))[:300], 'results:', b.get('results'))
          for r in (b.get('response') or [])[:3]:
              f = r.get('fixture', {}); t = r.get('teams', {})
              print(f.get('id'), f.get('date'), (t.get('home') or {}).get('name'), 'v', (t.get('away') or {}).get('name'), (r.get('fixture') or {}).get('status', {}).get('short'))
          "
      - name: WC2026 injuries access
        run: |
          curl -sS --max-time 60 "https://world-cup-analytics.vercel.app/api/schedule?af=injuries" -o /tmp/inj.json
          python3 -c "
          import json
          d = json.load(open('/tmp/inj.json'))
          b = d.get('body', {})
          print('http:', d.get('status'), 'errors:', json.dumps(b.get('errors'))[:300], 'results:', b.get('results'))
          for r in (b.get('response') or [])[:3]:
              print((r.get('player') or {}).get('name'), '|', (r.get('player') or {}).get('type'), '|', (r.get('player') or {}).get('reason'), '|', (r.get('team') or {}).get('name'))
          "
      - name: Forced sync (records injuries if accessible)
        run: |
          curl -sS --max-time 90 "https://world-cup-analytics.vercel.app/api/sync?force=1" | python3 -m json.tool
