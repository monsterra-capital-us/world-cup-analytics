# Temporary diagnostic: calls the deployed /api/sync with force=1 and prints
# the per-feed outcome, so feed credentials can be verified end-to-end.
# Removed once the feeds are confirmed working.
name: Feed probe

on: push

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Force-sync both feeds and print the summary
        run: |
          curl -sS --max-time 90 "https://world-cup-analytics.vercel.app/api/sync?force=1" | python3 -m json.tool
