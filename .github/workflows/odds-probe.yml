# Temporary diagnostic (removed when done): verifies The Odds API sport key
# and runs a forced sync against the real Pinnacle feed.
name: Odds probe

on: push

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Available soccer sport keys
        run: |
          curl -sS --max-time 60 "https://world-cup-analytics.vercel.app/api/schedule?oddsdiag=sports" | python3 -m json.tool | grep -iE 'world|fifa|status|error' || true
      - name: Forced sync (all feeds)
        run: |
          curl -sS --max-time 90 "https://world-cup-analytics.vercel.app/api/sync?force=1" | python3 -m json.tool
